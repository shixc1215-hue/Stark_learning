<title>Day 68 - P7 智能数仓元数据管理平台（Schema Diff + 血缘关联 + Markdown文档生成）</title>
<style>
  :root { --bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--surface3:#e2e8f0;--text:#1e293b;--text2:#475569;--text3:#94a3b8;--accent:#3b82f6;--accent2:#6366f1;--green:#16a34a;--orange:#ea580c;--red:#dc2626;--yellow:#ca8a04;--purple:#9333ea;--border:#cbd5e1;--radius:12px; }
  * { margin:0;padding:0;box-sizing:border-box; }
  body { font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.75;padding:20px;max-width:900px;margin:0 auto; }
  .header { background:linear-gradient(135deg,#eff6ff,#c7d2fe);border-radius:var(--radius);padding:28px 32px;margin-bottom:24px;border:1px solid #93c5fd; }
  .header .badge { display:inline-block;background:#dbeafe;color:#1e40af;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-bottom:12px;letter-spacing:.5px; }
  .header h1 { font-size:26px;font-weight:700;margin-bottom:6px; }
  .header .subtitle { color:var(--text2);font-size:15px; }
  .progress-bar { background:var(--surface);border-radius:var(--radius);padding:16px 24px;margin-bottom:24px;border:1px solid var(--border);display:flex;align-items:center;gap:16px; }
  .progress-bar .track { flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden; }
  .progress-bar .fill { height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));border-radius:4px; }
  .progress-bar .label { font-size:13px;color:var(--text3);white-space:nowrap; }
  .progress-bar .percent { font-size:14px;font-weight:700;color:var(--purple);min-width:42px;text-align:right; }
  .section { background:var(--surface);border-radius:var(--radius);padding:24px 28px;margin-bottom:20px;border:1px solid var(--border); }
  .section-title { display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--surface3); }
  .section-title .icon { font-size:22px; }
  .section-title .time-tag { margin-left:auto;font-size:12px;color:var(--orange);background:#fff7ed;padding:3px 10px;border-radius:12px;font-weight:600; }
  .concept-box { background:#faf5ff;border-left:3px solid var(--purple);padding:14px 18px;border-radius:0 8px 8px 0;margin:14px 0;font-size:14px;color:var(--text2); }
  .concept-box strong { color:var(--purple); }
  .tip-box { background:#eff6ff;border-left:3px solid var(--accent);padding:14px 18px;border-radius:0 8px 8px 0;margin:14px 0;font-size:14px;color:var(--text2); }
  .tip-box strong { color:var(--accent); }
  .warn-box { background:#fffbeb;border-left:3px solid var(--yellow);padding:14px 18px;border-radius:0 8px 8px 0;margin:14px 0;font-size:14px;color:var(--text2); }
  .warn-box strong { color:var(--yellow); }
  .error-box { background:#fef2f2;border-left:3px solid var(--red);padding:14px 18px;border-radius:0 8px 8px 0;margin:14px 0;font-size:14px;color:var(--text2); }
  .error-box strong { color:var(--red); }
  pre { background:#1e293b;color:#e2e8f0;padding:18px 20px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.7;margin:14px 0;tab-size:4; }
  pre .comment { color:#6b7280;font-style:italic; }
  pre .keyword { color:#c084fc; }
  pre .string { color:#34d399; }
  pre .func { color:#60a5fa; }
  pre .decorator { color:#f472b6; }
  pre .number { color:#fb923c; }
  pre .type { color:#fbbf24; }
  pre .op { color:#f87171; }
  h3 { font-size:16px;font-weight:700;margin:18px 0 10px;color:var(--text); }
  p { font-size:14.5px;color:var(--text2);margin-bottom:10px; }
  ul,ol { font-size:14.5px;color:var(--text2);padding-left:20px;margin-bottom:10px; }
  li { margin-bottom:4px; }
  strong { color:var(--text); }
  code { background:var(--surface2);padding:2px 6px;border-radius:4px;font-size:13px;color:#c084fc;font-family:'Cascadia Code','Fira Code',monospace; }
  .nav { display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap; }
  .nav a { text-decoration:none;padding:6px 14px;border-radius:8px;font-size:13px;background:var(--surface);color:var(--text2);border:1px solid var(--border);transition:all .2s; }
  .nav a:hover { background:var(--accent);color:#fff;border-color:var(--accent); }
  .nav a.active { background:var(--accent);color:#fff;border-color:var(--accent); }
  table { width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px; }
  th { background:var(--surface2);padding:10px 14px;text-align:left;font-weight:600;border:1px solid var(--border); }
  td { padding:10px 14px;border:1px solid var(--border);color:var(--text2); }
  .footer { text-align:center;padding:24px;color:var(--text3);font-size:13px; }
</style>
